name: Build GitHub Pages review artifact

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: URL base path for the review build
        required: true
        default: /kisa-cce-guide-web
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install development dependencies
        run: uv sync --dev --locked

      - name: Validate canonical content
        run: uv run --locked python -m conversion.validate_content

      - name: Build GitHub Pages artifact
        run: >-
          uv run --locked python -m conversion.build_content
          --base-path "${{ inputs.base_path }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v5
        with:
          path: .artifacts/build/site
          include-hidden-files: true
